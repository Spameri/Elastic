name: Package CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} - ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.5' ]
        version: [ lowest, standard ]
        elastic: [ '9.2.2' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, curl
          coverage: none

      - name: Configure sysctl limits
        run: |
          sudo swapoff -a
          sudo sysctl -w vm.swappiness=1
          sudo sysctl -w fs.file-max=262144
          sudo sysctl -w vm.max_map_count=262144

      - name: Start Elasticsearch
        uses: elastic/elastic-github-actions/elasticsearch@master
        with:
          stack-version: ${{ matrix.elastic }}
          security-enabled: false
          elasticsearch_options: action.destructive_requires_name=false

      - name: Install dependencies (lowest)
        if: matrix.version == 'lowest'
        run: make composer-lowest

      - name: Install dependencies (standard)
        if: matrix.version == 'standard'
        run: make composer

      - name: Run tests
        run: make tests

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: json, curl
          coverage: none

      - name: Install dependencies
        run: make composer

      - name: Check coding standards
        run: make cs

      - name: Run PHPStan
        run: make phpstan

  phpstan-lowest:
    name: PHPStan (lowest deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: json, curl
          coverage: none

      - name: Install dependencies
        run: make composer-lowest

      - name: Run PHPStan
        run: make phpstan-lowest

